{{- if not .Values.existingSecret }}
{{- fail "existingSecret is required (a Secret with the keys DatabaseConnString and YoutubeDataApiKey)" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "raovids.fullname" . }}
  labels:
    {{- include "raovids.labels" . | nindent 4 }}
spec:
  # One replica only: each instance runs its own video scanner.
  replicas: 1
  selector:
    matchLabels:
      {{- include "raovids.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "raovids.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: raovids
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: DatabaseConnString
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: DatabaseConnString
            - name: YoutubeDataApiKey
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: YoutubeDataApiKey
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
